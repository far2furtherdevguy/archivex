name: archivex
description: ZArchiver-style archive manager with AES-256-GCM encryption, storage permission flow and a built-in debug log.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  cryptography: ^2.7.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1

flutter:
  uses-material-design: true
